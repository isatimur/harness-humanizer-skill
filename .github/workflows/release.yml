name: release

# Publishes to PyPI on a version tag (e.g. `git tag v0.3.1 && git push --tags`).
# Uses PyPI Trusted Publishing (OIDC) — no API token is stored anywhere.
#
# One-time setup on PyPI → Account → Publishing → "Add a pending publisher":
#   PyPI Project Name : de-slop
#   Owner             : isatimur
#   Repository name   : de-slop
#   Workflow name     : release.yml
#   Environment name  : (leave BLANK)
# The publish job intentionally declares no GitHub environment, so the OIDC claim
# carries no environment — leaving the PyPI field blank is what makes them match.
# (An environment mismatch is the usual cause of `invalid-publisher`.)

on:
  push:
    tags:
      - "v*"

jobs:
  # Re-prove the stdlib-only contract before anything ships.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 tests/check_no_deps.py
      - run: python3 scripts/flag_slop.py --selftest
      - run: python3 tests/eval.py

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build sdist + wheel
        run: |
          python3 -m pip install --upgrade build twine
          python3 -m build
          python3 -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # No `environment:` on purpose — keeps the OIDC claim free of an environment,
    # so the PyPI trusted publisher must be registered with a BLANK environment.
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Idempotent re-runs: don't fail if a file was already uploaded.
          skip-existing: true
          # Leave `password` unset to use Trusted Publishing (OIDC) — the default
          # and the recommended path (no stored secret). If you'd rather use an
          # API token, add a repo secret PYPI_API_TOKEN and uncomment the next line;
          # the action uses the token when a password is supplied, OIDC otherwise.
          # password: ${{ secrets.PYPI_API_TOKEN }}
