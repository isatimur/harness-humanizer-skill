[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "de-slop"
version = "0.4.1"
description = "Deterministic AI-slop pre-flagger for the de-slop skill — zero dependencies, stdlib only."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Timur Isachenko" }]
keywords = ["humanize", "de-slop", "ai-slop", "writing", "editing", "prose", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Linguistic",
]
# No runtime dependencies — that is the whole point. Do not add any.
dependencies = []

[project.urls]
Homepage = "https://github.com/isatimur/de-slop"
Website = "https://de-slop-ai.vercel.app"
Repository = "https://github.com/isatimur/de-slop"
Changelog = "https://github.com/isatimur/de-slop/blob/main/CHANGELOG.md"

[project.scripts]
# `pipx install de-slop` then `de-slop FILE` / `--score` / `--profile stop-slop`
de-slop = "flag_slop:main"

[tool.setuptools]
py-modules = ["flag_slop"]

[tool.setuptools.package-dir]
"" = "scripts"
